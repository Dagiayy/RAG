[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Enterprise RAG + Knowledge Graph platform"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "greenlet>=3.1",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
ingestion = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "markdown-it-py>=3.0",
]
retrieval = [
    "qdrant-client>=1.12,<1.16",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.2",
    "neo4j>=5.26",
]
generation = [
    "openai>=1.0",
]
documents = [
    "python-docx>=1.1",
    "reportlab>=4.2",
]
ui = [
    "streamlit>=1.40",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
# LLM prompt text: wrapping hurts prompt readability more than the line
# length helps; a "noqa" comment can't be attached to lines inside a
# triple-quoted string without becoming part of the string itself.
"app/services/generation/query_understanding.py" = ["E501"]
"app/services/generation/answer_generation.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
