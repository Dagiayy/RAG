name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: enterprise_rag
          POSTGRES_USER: enterprise_rag
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enterprise_rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.15.0
        ports:
          - 6333:6333
          - 6334:6334
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/change_me
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p change_me 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://enterprise_rag:change_me@localhost:5432/enterprise_rag
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: change_me
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ hashFiles('app/config/settings.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ingestion,retrieval,generation,documents]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy app || true

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Integration tests
        run: pytest tests/integration -v

      - name: Security tests
        run: pytest tests/security -v

      - name: Evaluation tests
        run: pytest tests/evaluation -v
